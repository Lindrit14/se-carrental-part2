name: platform

services:
  # ── Shared Infra ────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: platform-rabbitmq
    ports:
      - "15672:15672"   # management UI only — AMQP 5672 stays internal
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - rabbit-data:/var/lib/rabbitmq
    networks: [platform]

  redis:
    image: redis:7-alpine
    container_name: platform-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data
    networks: [platform]

  # ── api-gateway ────────────────────────────────────────────────
  api-gateway:
    build: ./apiGateway
    image: api-gateway:dev
    container_name: platform-api-gateway
    environment:
      SPRING_PROFILES_ACTIVE: docker
      HTTP_PORT: "8080"
      USER_AUTH_URL: http://user-auth:8081
      CAR_SERVICE_URL: http://car-service:8082
      BOOKING_SERVICE_URL: http://booking:8080
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public.pem
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173"
    volumes:
      - ./shared-secrets:/run/secrets:ro
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      user-auth:
        condition: service_started
      car-service:
        condition: service_started
      booking:
        condition: service_started
      currency-converter:
        condition: service_healthy
    restart: unless-stopped
    networks: [platform]

  # ── user-auth ──────────────────────────────────────────────────
  user-auth-mongo:
    image: mongo:7
    container_name: platform-user-auth-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [platform]

  user-auth:
    build: ./user-authManagement
    image: user-auth:dev
    container_name: platform-user-auth
    environment:
      HTTP_PORT: "8081"
      LOG_LEVEL: info
      LOG_FORMAT: json
      MONGO_URI: "mongodb://root:example@user-auth-mongo:27017/?authSource=admin"
      MONGO_DATABASE: auth
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      RABBITMQ_EXCHANGE: user.events
      JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private.pem
      JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public.pem
      JWT_ISSUER: user-auth
      ADMIN_BOOTSTRAP_EMAIL: "admin@uni.de"
      ADMIN_BOOTSTRAP_PASSWORD: "ChangeMeChangeMe"
    volumes:
      - ./shared-secrets:/run/secrets:ro
    expose:
      - "8081"
    depends_on:
      user-auth-mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks: [platform]

  # ── cars-db + car-service ──────────────────────────────────────
  cars-db:
    image: postgres:16-alpine
    container_name: platform-cars-db
    environment:
      POSTGRES_USER: car
      POSTGRES_PASSWORD: car
      POSTGRES_DB: cars_db
    volumes:
      - cars-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U car"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [platform]

  car-service:
    build: ./carMicroservice
    image: car-service:dev
    container_name: platform-car-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://cars-db:5432/cars_db
      SPRING_DATASOURCE_USERNAME: car
      SPRING_DATASOURCE_PASSWORD: car
      JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public.pem
      CURRENCY_CONVERTER_GRPC_ADDRESS: currency-converter:9000
      CURRENCY_CONVERTER_GRPC_DEADLINE_MS: "5000"
    volumes:
      - ./shared-secrets:/run/secrets:ro
    expose:
      - "8082"
    depends_on:
      cars-db:
        condition: service_healthy
      currency-converter:
        condition: service_healthy
    restart: unless-stopped
    networks: [platform]

  # ── booking ────────────────────────────────────────────────────
  booking-db:
    image: postgres:16-alpine
    container_name: platform-booking-db
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: booking
    volumes:
      - booking-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [platform]

  booking:
    build: ./carBookingMicroservice
    image: car-booking:dev
    container_name: platform-booking
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://booking-db:5432/booking
      SPRING_DATASOURCE_USERNAME: booking
      SPRING_DATASOURCE_PASSWORD: booking
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public.pem
      CURRENCY_CONVERTER_GRPC_ADDRESS: currency-converter:9000
      CURRENCY_CONVERTER_GRPC_DEADLINE_MS: "5000"
      CAR_SERVICE_URL: http://car-service:8082
    volumes:
      - ./shared-secrets:/run/secrets:ro
    expose:
      - "8080"
    depends_on:
      booking-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      car-service:
        condition: service_started
    restart: unless-stopped
    networks: [platform]

  # ── currency-converter ─────────────────────────────────────────
  currency-converter:
    build: ./currencyConverterMicroservice
    image: currency-converter:dev
    container_name: platform-currency-converter
    environment:
      ECB_FEED_URL: https://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml
      ECB_REFRESH_INTERVAL: "3600"
      GRPC_PORT: "9000"
      LOG_LEVEL: info
    expose:
      - "9000"
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=:9000"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks: [platform]

  # ── notification ──────────────────────────────────────────────
  notification:
    build: ./notificationMicroservice
    image: notification-service:dev
    container_name: platform-notification
    environment:
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      HTTP_PORT: "8084"
      NOTIFIER_TYPE: mock
      FROM_NAME: "Car Rental"
      REDIS_ADDR: redis:6379
      FRONTEND_BASE_URL: http://localhost:3000
    expose:
      - "8084"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [platform]

  # ── frontend ──────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
    image: frontend:dev
    container_name: platform-frontend
    ports:
      - "3000:80"
    depends_on:
      api-gateway:
        condition: service_started
    restart: unless-stopped
    networks: [platform]

volumes:
  rabbit-data:
  redis-data:
  mongo-data:
  cars-data:
  booking-data:

networks:
  platform:
    driver: bridge
