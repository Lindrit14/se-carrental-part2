spring:
  application:
    name: car-service
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
      indent-output: false
  datasource:
    url: jdbc:postgresql://localhost:5432/cars_db
    username: car
    password: car
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: file:${JWT_PUBLIC_KEY_FILE:./shared-secrets/jwt_public.pem}

server:
  port: ${HTTP_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

grpc:
  client:
    currency-converter:
      address: ${CURRENCY_CONVERTER_GRPC_ADDRESS:localhost:9000}
      deadline-ms: ${CURRENCY_CONVERTER_GRPC_DEADLINE_MS:5000}

logging:
  level:
    root: INFO
    com.uni.car: INFO
