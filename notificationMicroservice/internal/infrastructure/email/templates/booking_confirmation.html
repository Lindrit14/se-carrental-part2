<!DOCTYPE html>
<html>
<body style="font-family: Arial, sans-serif; max-width: 600px; margin: 24px auto; color: #333; line-height: 1.5;">
    <h2 style="color: #1a73e8;">Booking Confirmed</h2>
    <p>Hi,</p>
    <p>Your booking has been confirmed. Here are the details:</p>
    <table style="border-collapse: collapse; width: 100%; margin: 16px 0;">
        <tr><td style="padding:8px;border-bottom:1px solid #eee;"><strong>Booking ID</strong></td><td style="padding:8px;border-bottom:1px solid #eee;">{{.BookingID}}</td></tr>
        <tr><td style="padding:8px;border-bottom:1px solid #eee;"><strong>Car</strong></td><td style="padding:8px;border-bottom:1px solid #eee;">{{.CarID}}</td></tr>
        <tr><td style="padding:8px;border-bottom:1px solid #eee;"><strong>Pick-up</strong></td><td style="padding:8px;border-bottom:1px solid #eee;">{{.StartDate}}</td></tr>
        <tr><td style="padding:8px;border-bottom:1px solid #eee;"><strong>Return</strong></td><td style="padding:8px;border-bottom:1px solid #eee;">{{.EndDate}}</td></tr>
        <tr><td style="padding:8px;"><strong>Total</strong></td><td style="padding:8px;">{{.TotalAmount}} {{.TotalCurrency}}</td></tr>
    </table>
    <p>We look forward to seeing you. Safe travels!</p>
    <hr style="border:none;border-top:1px solid #eee;margin:24px 0;">
    <p style="font-size: 12px; color: #888;">This is an automated message — please do not reply.</p>
</body>
</html>
