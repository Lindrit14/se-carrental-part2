spring:
  application:
    name: api-gateway

  # Spring Cloud Gateway uses Netty + WebFlux. MVC must be excluded.
  main:
    web-application-type: reactive

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cloud:
    gateway:
      default-filters:
        # Downstream services still set their own CORS headers in addition to
        # the gateway's; browsers reject duplicate Access-Control-Allow-Origin
        # values. RETAIN_UNIQUE dedupes within each header. (Removing CORS
        # from downstream services is a Phase 5 cleanup — gateway owns CORS.)
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Access-Control-Expose-Headers Vary, RETAIN_UNIQUE
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 100
            redis-rate-limiter.burstCapacity: 150
            redis-rate-limiter.requestedTokens: 1
            key-resolver: "#{@ipKeyResolver}"
      routes:
        - id: user-auth
          uri: ${USER_AUTH_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**,/api/v1/users/**,/api/v1/admin/users,/api/v1/admin/users/**

        - id: cars
          uri: ${CAR_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/cars,/api/v1/cars/**

        - id: bookings
          uri: ${BOOKING_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/bookings,/api/v1/bookings/**,/api/v1/admin/bookings,/api/v1/admin/bookings/**

        - id: currency-http
          uri: ${CURRENCY_SERVICE_URL:http://localhost:8000}
          predicates:
            - Path=/api/v1/rates,/api/v1/rates/**,/api/v1/convert,/api/v1/convert/**

  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: file:${JWT_PUBLIC_KEY_FILE:./shared-secrets/jwt_public.pem}

server:
  port: ${HTTP_PORT:8080}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO
