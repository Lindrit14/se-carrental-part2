name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force-all:
        description: 'Alle 7 Services neu bauen (auch wenn nichts geändert)'
        type: boolean
        default: false

# OIDC: id-token: write nötig damit azure/login@v2 sich gegen Azure AD
# authentifiziert. contents: read damit der Code gechecked werden kann.
permissions:
  id-token: write
  contents: read

env:
  AZURE_RG: platform-rg
  AZURE_ACR: platformacrlp13

jobs:
  # ------------------------------------------------------------------
  # 1. detect-changes: ermittelt welche Services neu gebaut werden
  #    müssen und emittiert die Matrix als JSON-Array.
  #
  #    Wir bauen die Matrix HIER dynamisch (statt im build-Job mit
  #    statischer matrix.include + if:), weil GHA keinen Zugriff auf
  #    matrix.* im job-level if: erlaubt. Der dynamische Ansatz spart
  #    außerdem Runner-Zeit (keine leeren Skip-Jobs).
  # ------------------------------------------------------------------
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      has-changes: ${{ steps.build-matrix.outputs.has-changes }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api-gateway:
              - 'apiGateway/**'
            user-auth:
              - 'user-authManagement/**'
            car-service:
              - 'carMicroservice/**'
            booking:
              - 'carBookingMicroservice/**'
            currency-converter:
              - 'currencyConverterMicroservice/**'
            notification:
              - 'notificationMicroservice/**'
            frontend:
              - 'frontend/**'

      - id: build-matrix
        env:
          FORCE_ALL: ${{ inputs.force-all }}
          F_API_GATEWAY: ${{ steps.filter.outputs.api-gateway }}
          F_USER_AUTH: ${{ steps.filter.outputs.user-auth }}
          F_CAR_SERVICE: ${{ steps.filter.outputs.car-service }}
          F_BOOKING: ${{ steps.filter.outputs.booking }}
          F_CURRENCY: ${{ steps.filter.outputs.currency-converter }}
          F_NOTIFICATION: ${{ steps.filter.outputs.notification }}
          F_FRONTEND: ${{ steps.filter.outputs.frontend }}
        run: |
          set -euo pipefail
          ITEMS=()

          maybe_add() {
            local flag="$1" service="$2" context="$3"
            if [[ "$FORCE_ALL" == "true" || "$flag" == "true" ]]; then
              ITEMS+=("{\"service\":\"$service\",\"context\":\"$context\"}")
            fi
          }

          maybe_add "$F_API_GATEWAY"  api-gateway        apiGateway
          maybe_add "$F_USER_AUTH"    user-auth          user-authManagement
          maybe_add "$F_CAR_SERVICE"  car-service        carMicroservice
          maybe_add "$F_BOOKING"      booking            carBookingMicroservice
          maybe_add "$F_CURRENCY"     currency-converter currencyConverterMicroservice
          maybe_add "$F_NOTIFICATION" notification       notificationMicroservice
          maybe_add "$F_FRONTEND"     frontend           frontend

          if [[ ${#ITEMS[@]} -eq 0 ]]; then
            MATRIX='[]'
            HAS_CHANGES='false'
          else
            MATRIX="[$(IFS=,; echo "${ITEMS[*]}")]"
            HAS_CHANGES='true'
          fi

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "has-changes=$HAS_CHANGES" >> "$GITHUB_OUTPUT"
          echo "→ Matrix: $MATRIX"

  # ------------------------------------------------------------------
  # 2. fetch-azure-config: ACR-Login-Server + api-gateway-FQDN holen.
  #    Skip wenn keine Services geändert wurden.
  # ------------------------------------------------------------------
  fetch-azure-config:
    needs: detect-changes
    if: needs.detect-changes.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    outputs:
      acr-login-server: ${{ steps.config.outputs.acr-login-server }}
      api-gateway-url: ${{ steps.config.outputs.api-gateway-url }}
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - id: config
        run: |
          ACR_LOGIN_SERVER=$(az acr show -n "$AZURE_ACR" --query loginServer -o tsv)
          API_GW_FQDN=$(az containerapp show -n api-gateway -g "$AZURE_RG" \
            --query properties.configuration.ingress.fqdn -o tsv)

          echo "acr-login-server=$ACR_LOGIN_SERVER" >> "$GITHUB_OUTPUT"
          echo "api-gateway-url=https://$API_GW_FQDN" >> "$GITHUB_OUTPUT"

          echo "→ ACR: $ACR_LOGIN_SERVER"
          echo "→ API Gateway: https://$API_GW_FQDN"

  # ------------------------------------------------------------------
  # 3. build-and-deploy: Dynamische Matrix nur über Services die in
  #    detect-changes als geändert markiert wurden.
  # ------------------------------------------------------------------
  build-and-deploy:
    needs: [detect-changes, fetch-azure-config]
    if: needs.detect-changes.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR-Login (schreibt Docker-Creds für die ACR)
        run: az acr login --name "$AZURE_ACR"

      - uses: docker/setup-buildx-action@v3

      # Frontend braucht zwei Build-Args: VITE_API_URL (zur Build-Zeit
      # vom Vite-Bundler ins Bundle gebacken) + VITE_GOOGLE_MAPS_API_KEY.
      # Die anderen 6 Services haben keine Build-Args.
      - name: Build & Push (frontend)
        if: matrix.service == 'frontend'
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          push: true
          tags: |
            ${{ needs.fetch-azure-config.outputs.acr-login-server }}/${{ matrix.service }}:${{ github.sha }}
            ${{ needs.fetch-azure-config.outputs.acr-login-server }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          build-args: |
            VITE_API_URL=${{ needs.fetch-azure-config.outputs.api-gateway-url }}
            VITE_GOOGLE_MAPS_API_KEY=${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}

      - name: Build & Push (Backend-Services)
        if: matrix.service != 'frontend'
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          push: true
          tags: |
            ${{ needs.fetch-azure-config.outputs.acr-login-server }}/${{ matrix.service }}:${{ github.sha }}
            ${{ needs.fetch-azure-config.outputs.acr-login-server }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Container App auf neues Image updaten
        run: |
          IMAGE="${{ needs.fetch-azure-config.outputs.acr-login-server }}/${{ matrix.service }}:${{ github.sha }}"
          echo "→ az containerapp update -n ${{ matrix.service }} --image $IMAGE"
          az containerapp update \
            --name "${{ matrix.service }}" \
            --resource-group "$AZURE_RG" \
            --image "$IMAGE" \
            --output none

          echo "✓ ${{ matrix.service }} läuft jetzt mit $IMAGE"
